# GitHub Actions 工作流程：建置 Debug APK
# 到 Actions 頁面選擇 Build APK，按 Run workflow 即可手動執行
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安裝 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 確認並安裝 compileSdk 與 build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "使用 sdkmanager: $SDKMANAGER"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "SDK 元件已存在，略過安裝"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: 建置 Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
